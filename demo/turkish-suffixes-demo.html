    function clicked() {
        var first_time = window.performance.now(),
            input      = document.getElementById("i"),
            html       = makeBlock(input.value),
            last_time  = window.performance.now();

        output.innerHTML = html + "<p>" + (last_time - first_time) / 1000 + " seconds for " + input.value + "</p>";
    }

    function test() {
        var html       = '',
            first_time = window.performance.now();

        for(var i = 0; i < Nouns.length; i++) {
            html += makeBlock(Nouns[i]);
        }

        var last_time = window.performance.now();

        html += "<p>" + (last_time - first_time) / 1000 + " seconds for <b>" + Nouns.length + " </b>names</p>";
        output.innerHTML = html;
    }

    function makeBlock(noun) {
        var html = '';
        if(noun == "World") {
            html += "<blockquote>";
            html += "<b>Belirtme (Accusative) :</b> " + Turkce.accusativeCase("öld", noun) + "<br>";
            html += "<b>Yönelme (Dative) :</b> " + Turkce.yonelmeHali("öld", noun) + "<br>";
            html += "<b>Bulunma (Locative) :</b> " + Turkce.bulunmaHali("öld", noun) + "<br>";
            html += "<b>Ayrılma (Ablative) :</b> " + Turkce.ayrilmaHali("öld", noun) + "<br>";
            html += "<b>Sahiplik (Genitive) :</b> " + Turkce.sahiplikHali("öld", noun) + "<br>";
            html += "<b>Vasıta (Comitative) :</b> " + Turkce.vasitaHali("öld", noun) + "<br>";
            html += "<b>Dahi Bağlacı (Conjunction) :</b> " + Turkce.dahiBaglac("öld", noun) + "<br>";
            html += "<b>Sıra Sayı (Ordinal Number) :</b> " + Turkce.siraSayi(noun) + "<br>";
            html += "<b>Üleştirme (Distributive) :</b> " + Turkce.ulestirme(noun) + "<br>";
            html += "</blockquote>";
        } else {
            html += "<blockquote>";
